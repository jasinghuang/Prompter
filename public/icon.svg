<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A1F"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- 提 character -->
  <text x="512" y="600" text-anchor="middle" dominant-baseline="central"
        font-family="'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', sans-serif"
        font-weight="700" font-size="420" fill="#D4A432" letter-spacing="0">
    提
  </text>

  <!-- Subtle amber line below -->
  <rect x="300" y="760" width="424" height="4" rx="2" fill="#D4A432" opacity="0.3"/>
</svg>
