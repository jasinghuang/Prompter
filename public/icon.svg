<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1A1C"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="redglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>

  <!-- Speech bubble (glow + stroke) -->
  <rect x="280" y="352" width="464" height="320" rx="72" fill="none" stroke="#D4A432" stroke-width="64" opacity="0.45" filter="url(#glow)"/>
  <rect x="280" y="352" width="464" height="320" rx="72" fill="none" stroke="#D4A432" stroke-width="64"/>

  <!-- Teleprompter text lines -->
  <path d="M 392 464 H 632 M 392 560 H 520" fill="none" stroke="#D4A432" stroke-width="56" stroke-linecap="round"/>

  <!-- REC indicator (top-left, glowing red dot) -->
  <circle cx="192" cy="224" r="52" fill="#EF4444" opacity="0.5" filter="url(#redglow)"/>
  <circle cx="192" cy="224" r="36" fill="#EF4444"/>
</svg>
