<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Wordmark: "Perhaps" in two lines -->
  <!-- PER -->
  <text x="512" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="180" letter-spacing="10" fill="white">PER</text>

  <!-- Yellow reading line cutting through the word -->
  <rect x="140" y="482" width="744" height="6" rx="3" fill="url(#accent)" filter="url(#glow)"/>

  <!-- HAPS -->
  <text x="512" y="660" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="180" letter-spacing="10" fill="white">HAPS</text>

  <!-- Side reading markers -->
  <circle cx="90" cy="485" r="8" fill="#eab308" opacity="0.4"/>
  <circle cx="934" cy="485" r="8" fill="#eab308" opacity="0.4"/>

  <!-- Subtle text lines above and below -->
  <rect x="240" y="230" width="544" height="3" rx="1.5" fill="#333" opacity="0.4"/>
  <rect x="280" y="260" width="464" height="3" rx="1.5" fill="#333" opacity="0.5"/>
  <rect x="220" y="290" width="584" height="3" rx="1.5" fill="#333" opacity="0.5"/>
  <rect x="310" y="320" width="404" height="3" rx="1.5" fill="#333" opacity="0.4"/>

  <rect x="300" y="770" width="424" height="3" rx="1.5" fill="#333" opacity="0.4"/>
  <rect x="220" y="800" width="584" height="3" rx="1.5" fill="#333" opacity="0.5"/>
  <rect x="270" y="830" width="484" height="3" rx="1.5" fill="#333" opacity="0.5"/>
  <rect x="330" y="860" width="364" height="3" rx="1.5" fill="#333" opacity="0.4"/>
</svg>
